profiles:

  "1":
    name: "Test — pipeline validation"
    description: "Haiku, no web search, placeholder output. Validates the full pipeline runs end-to-end."
    estimated_cost: "$0.04–0.10"
    brief_mode: true
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      research:  { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      feedback:  { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      spec:      { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }
      stories:   { model: claude-haiku-4-5-20251001, max_tokens: 2000, max_searches: 0 }

  "2":
    name: "Budget — full run, all Haiku"
    description: "Complete pipeline with web search. All steps use the fastest, cheapest model."
    estimated_cost: "$0.30–0.60"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,  max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 800,  max_searches: 0 }
      research:  { model: claude-haiku-4-5-20251001, max_tokens: 4000, max_searches: 5 }
      feedback:  { model: claude-haiku-4-5-20251001, max_tokens: 4000, max_searches: 5 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 1500, max_searches: 0 }
      spec:      { model: claude-haiku-4-5-20251001, max_tokens: 6000, max_searches: 0 }
      stories:   { model: claude-haiku-4-5-20251001, max_tokens: 6000, max_searches: 0 }

  "3":
    name: "Balanced — Sonnet for quality steps"
    description: "Sonnet for research, feedback, spec and stories. Best cost/quality trade-off."
    estimated_cost: "$2.00–3.00"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,  max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 800,  max_searches: 0 }
      research:  { model: claude-sonnet-4-6,          max_tokens: 6000, max_searches: 5 }
      feedback:  { model: claude-sonnet-4-6,          max_tokens: 6000, max_searches: 5 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 1500, max_searches: 0 }
      spec:      { model: claude-sonnet-4-6,          max_tokens: 8000, max_searches: 0 }
      stories:   { model: claude-sonnet-4-6,          max_tokens: 6000, max_searches: 0 }

  "4":
    name: "Optimal — Opus for research, Sonnet elsewhere"
    description: "Deepest research and feedback quality. Recommended for high-stakes decisions."
    estimated_cost: "$4.00–7.00"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,  max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 800,  max_searches: 0 }
      research:  { model: claude-opus-4-7,            max_tokens: 8000, max_searches: 8 }
      feedback:  { model: claude-opus-4-7,            max_tokens: 8000, max_searches: 8 }
      synthesis: { model: claude-sonnet-4-6,          max_tokens: 2000, max_searches: 0 }
      spec:      { model: claude-sonnet-4-6,          max_tokens: 8000, max_searches: 0 }
      stories:   { model: claude-sonnet-4-6,          max_tokens: 6000, max_searches: 0 }

# Phase 2: Discord connector
discord:
  channels: []  # list of Discord channel IDs to read feedback from

# Phase 2: Notion connector
notion:
  database_id: ""  # Notion database ID where user stories will be created
