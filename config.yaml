# Per-step settings in each profile:
#
#   model         Claude model used for the step.
#   max_tokens    Ceiling on one response. You pay only for tokens actually produced, and it does
#                 not count toward the output-tokens-per-minute limit, so set it above the
#                 expected output: a step that fits finishes in one request, while one that
#                 does not is continued (and each continuation re-sends the input).
#                 Profile 1 keeps small ceilings on purpose, to keep test runs cheap.
#   max_searches  The most web searches the step may run. Sent to the API as max_uses, which
#                 enforces it; 0 turns search off. Each search adds roughly 9,000 to 12,000 input tokens
#                 (two measurements), so a lower number is cheaper and faster but narrows the
#                 research. At a low rate-limit tier, keep it small enough that the whole step
#                 fits in one minute of input allowance.
#
# estimated_cost figures are rough: they do not account for the larger max_tokens ceilings
# or for prompt caching, and have not been measured.

profiles:

  "1":
    name: "Test — pipeline validation"
    description: "Haiku, no web search, micro prompts. Validates pipeline wiring end-to-end."
    estimated_cost: "$0.01–0.02"
    brief_mode: true
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      research:  { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      feedback:  { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      spec:      { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }
      stories:   { model: claude-haiku-4-5-20251001, max_tokens: 400, max_searches: 0 }

  "2":
    name: "Budget — full run, all Haiku"
    description: "Complete pipeline with web search. All steps use the fastest, cheapest model."
    estimated_cost: "$0.30–0.60"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,   max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 1500,  max_searches: 0 }
      research:  { model: claude-haiku-4-5-20251001, max_tokens: 16000, max_searches: 5 }
      feedback:  { model: claude-haiku-4-5-20251001, max_tokens: 16000, max_searches: 5 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 3000,  max_searches: 0 }
      spec:      { model: claude-haiku-4-5-20251001, max_tokens: 16000, max_searches: 0 }
      stories:   { model: claude-haiku-4-5-20251001, max_tokens: 32000, max_searches: 0 }

  "3":
    name: "Balanced — Sonnet for quality steps"
    description: "Sonnet for research, feedback, spec and stories. Best cost/quality trade-off."
    estimated_cost: "$2.00–3.00"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,   max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 1500,  max_searches: 0 }
      research:  { model: claude-sonnet-4-6,          max_tokens: 16000, max_searches: 5 }
      feedback:  { model: claude-sonnet-4-6,          max_tokens: 16000, max_searches: 5 }
      synthesis: { model: claude-haiku-4-5-20251001, max_tokens: 3000,  max_searches: 0 }
      spec:      { model: claude-sonnet-4-6,          max_tokens: 16000, max_searches: 0 }
      stories:   { model: claude-sonnet-4-6,          max_tokens: 32000, max_searches: 0 }

  "4":
    name: "Optimal — Opus for research, Sonnet elsewhere"
    description: "Deepest research and feedback quality. Recommended for high-stakes decisions."
    estimated_cost: "$4.00–7.00"
    brief_mode: false
    steps:
      pre_step:  { model: claude-haiku-4-5-20251001, max_tokens: 512,   max_searches: 0 }
      compress:  { model: claude-haiku-4-5-20251001, max_tokens: 1500,  max_searches: 0 }
      research:  { model: claude-opus-4-7,            max_tokens: 16000, max_searches: 8 }
      feedback:  { model: claude-opus-4-7,            max_tokens: 16000, max_searches: 8 }
      synthesis: { model: claude-sonnet-4-6,          max_tokens: 3000,  max_searches: 0 }
      spec:      { model: claude-sonnet-4-6,          max_tokens: 16000, max_searches: 0 }
      stories:   { model: claude-sonnet-4-6,          max_tokens: 32000, max_searches: 0 }

# Phase 2: Discord connector
discord:
  channels: []  # list of Discord channel IDs to read feedback from

# Phase 2: Notion connector
notion:
  database_id: ""  # Notion database ID where user stories will be created
